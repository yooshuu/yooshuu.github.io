title: "yooshuu"
description: "새로 올라온 기술 소식과 달라진 점을 공식 자료로 정리합니다."
url: "https://yooshuu.github.io"
baseurl: ""
lang: "ko-KR"
timezone: "Asia/Seoul"

author:
  name: "yooshuu"

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
