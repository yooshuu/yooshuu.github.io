title: "yooshuu's Tech Notes"
description: "변화하는 기술의 흐름과 실습 너머 '왜'라는 본질을 기록합니다."
url: "https://yooshuu.github.io"
baseurl: ""
lang: "ko-KR"
timezone: "Asia/Seoul"

author:
  name: "yooshuu"

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
